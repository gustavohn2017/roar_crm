<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Roar CRM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --color-dark: #121212;
            --color-dark-lighter: #1e1e1e;
            --color-dark-medium: #282828;
            --color-dark-light: #333333;
            --color-gold: #d4af37;
            --color-gold-dark: #aa8c2c;
            --color-text: #e0e0e0;
            --color-text-muted: #aaaaaa;
            --color-danger: #cf6679;
        }
        
        body {
            background-color: var(--color-dark);
            color: var(--color-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }
        
        .auth-box {
            background-color: var(--color-dark-lighter);
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .auth-header {
            background-color: var(--color-dark-medium);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--color-dark-light);
        }
        
        .auth-header i {
            font-size: 1.8rem;
            color: var(--color-gold);
            margin-bottom: 0.5rem;
        }
        
        .auth-header h4 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--color-gold);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .auth-body {
            padding: 2rem 1.5rem;
        }
        
        .auth-title {
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.2rem;
            color: var(--color-text);
            font-weight: 500;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }
        
        .form-control {
            height: auto;
            padding: 0.65rem 0.75rem;
            background-color: var(--color-dark-medium);
            border: 1px solid var(--color-dark-light);
            color: var(--color-text);
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            border-color: var(--color-gold-dark);
            background-color: var(--color-dark-light);
            box-shadow: 0 0 0 0.25rem rgba(170, 140, 44, 0.25);
            color: var(--color-text);
        }
        
        .input-group-text {
            background-color: var(--color-dark-medium);
            border: 1px solid var(--color-dark-light);
            color: var(--color-gold);
        }
        
        .btn-login {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            background-color: var(--color-gold-dark);
            border: none;
            color: var(--color-dark);
            font-weight: 600;
            text-align: center;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            background-color: var(--color-gold);
            transform: translateY(-1px);
        }
        
        .btn-login:active {
            transform: translateY(1px);
        }
        
        .auth-footer {
            text-align: center;
            padding: 1rem;
            background-color: var(--color-dark-medium);
            border-top: 1px solid var(--color-dark-light);
        }
        
        .auth-footer p {
            margin: 0;
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }
        
        .alert-error {
            background-color: rgba(207, 102, 121, 0.1);
            border: 1px solid rgba(207, 102, 121, 0.3);
            color: var(--color-danger);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="bi bi-award"></i>
                <h4>Roar CRM</h4>
            </div>
            
            <div class="auth-body">
                <h5 class="auth-title">Login do Sistema</h5>
                
                {% if form.errors %}
                <div class="alert alert-error mb-3">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Usuário ou senha inválidos
                </div>
                {% endif %}
                
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_username">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="id_password">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
            
            <div class="auth-footer">
                <p>&copy; {% now "Y" %} Lions Assessoria Comercial</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
